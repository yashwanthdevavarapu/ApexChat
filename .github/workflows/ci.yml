name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build · unit + integration tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write # test report annotations
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Check formatting (google-java-format)
        run: ./mvnw -B -ntp spotless:check

      - name: Build, test and enforce coverage
        # Docker is available on GitHub runners, so PostgresIT (Testcontainers) runs here
        run: ./mvnw -B -ntp verify

      - name: Coverage summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import csv, os
          path = "target/site/jacoco/jacoco.csv"
          if not os.path.exists(path):
              print("No coverage report produced."); raise SystemExit
          rows = list(csv.DictReader(open(path)))
          print("### Coverage\n\n| Counter | Covered |\n|---|---:|")
          for k in ("LINE", "BRANCH", "INSTRUCTION"):
              m = sum(int(r[k + "_MISSED"]) for r in rows); c = sum(int(r[k + "_COVERED"]) for r in rows)
              print(f"| {k.title()} | {100 * c / (m + c):.1f}% |")
          PY

      - name: Publish test report
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: |
            target/surefire-reports/TEST-*.xml
            target/failsafe-reports/TEST-*.xml
          check_name: JUnit results

      - name: Upload application jar
        uses: actions/upload-artifact@v7
        with:
          name: apexchat-jar
          path: target/apexchat.jar
          retention-days: 7

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: target/site/jacoco/
          retention-days: 14

  e2e:
    name: End-to-end · Playwright
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - uses: actions/download-artifact@v8
        with:
          name: apexchat-jar
          path: target

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npx playwright test --project=e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14

  docker:
    name: Docker image builds
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: apexchat:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test the container
        run: |
          docker run -d --name apexchat -p 8080:8080 apexchat:ci
          for i in $(seq 1 60); do
            if curl -fs http://localhost:8080/actuator/health/readiness; then echo; exit 0; fi
            sleep 2
          done
          docker logs apexchat
          exit 1
