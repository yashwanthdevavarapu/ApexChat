version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      spring:
        patterns: ["org.springframework*"]
      test:
        patterns: ["org.testcontainers*", "org.junit*", "org.assertj*", "org.mockito*"]

  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
