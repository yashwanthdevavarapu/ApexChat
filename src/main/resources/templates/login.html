<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Sign in')}"></head>
<body class="auth-page">
<main class="auth-shell">
  <section th:replace="~{fragments/layout :: authHero}"></section>

  <section class="auth-card-wrap">
    <form class="auth-card" th:action="@{/login}" method="post" data-testid="login-form">
      <div class="brand-row compact">
        <svg th:replace="~{fragments/layout :: logo(28)}"></svg>
        <span class="brand-name">ApexChat</span>
      </div>
      <h1>Welcome back</h1>
      <p class="muted">Sign in to pick up where the conversation left off.</p>

      <div th:if="${param.error}" class="alert alert-error" role="alert" data-testid="login-error">
        Invalid username or password.
      </div>
      <div th:if="${param.logout}" class="alert alert-info" role="status">You have been signed out.</div>
      <div th:if="${registered}" class="alert alert-success" role="status" data-testid="registered-banner">
        Account <b th:text="${registered}">user</b> created. Sign in to start chatting.
      </div>

      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" required autofocus
             th:value="${registered}" data-testid="username">

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required
             data-testid="password">

      <button type="submit" class="btn btn-primary btn-block" data-testid="login-submit">Sign in</button>

      <p class="switch">New to ApexChat? <a th:href="@{/register}" data-testid="register-link">Create an account</a></p>
    </form>
  </section>
</main>
</body>
</html>
