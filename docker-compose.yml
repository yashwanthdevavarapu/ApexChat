# Production-like stack: ApexChat + PostgreSQL 16.
#   docker compose up --build      -> http://localhost:8080
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: apexchat
      POSTGRES_USER: apexchat
      POSTGRES_PASSWORD: apexchat
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apexchat -d apexchat"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    image: apexchat:local
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://postgres:5432/apexchat
      DB_USER: apexchat
      DB_PASSWORD: apexchat
    ports:
      - "8080:8080"

volumes:
  pgdata:
